[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "neuraljaxlib"
version = "0.1.0"
description = "GPU-accelerated, lightweight ML framework in JAX with PyTorch-style modules and explicit training loops"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
authors = [{name = "Rudramani Singha"}]
dependencies = ["jax>=0.5.3,<0.6", "flax==0.10.4", "optax>=0.2.4,<0.2.5", "numpy>=1.24,<3"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.optional-dependencies]
cuda = ["jax[cuda12]==0.5.3"]
dev = ["pytest>=8", "build", "ruff"]
examples = ["matplotlib>=3.7", "pandas>=2", "scikit-learn>=1.3", "pillow>=10"]
notebooks = ["neuraljaxlib[examples]", "jupyterlab>=4", "nbclient", "nbformat", "ipykernel"]
docs = ["sphinx>=7,<9", "myst-nb>=1.2,<2", "pydata-sphinx-theme>=0.19,<0.20"]

[project.urls]
Repository = "https://github.com/rgs2151/NeuralJAXlib"

[tool.hatch.build.targets.wheel]
packages = ["src/neuraljaxlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
